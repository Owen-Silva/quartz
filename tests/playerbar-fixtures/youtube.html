<!doctype html><html><head><meta charset="utf-8"><title>Play bar test - YouTube</title>
<!-- A stand-in for youtube.com/watch trimmed to the player (the way Lumen's play view shows it): a local
     looping clip, a fake movie_player API (quality levels, captions, audio tracks), YouTube's own bar
     (.ytp-chrome-bottom) and an ad state with its own Skip button, countdown and "Why this ad". -->
<style>
html,body{margin:0;height:100%;background:#000;color:#eee;font:14px/1.4 "Segoe UI",sans-serif;overflow:hidden}
#movie_player{position:absolute;inset:0}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.ytp-chrome-bottom{position:absolute;left:12px;right:12px;bottom:0;height:48px;display:flex;align-items:center;gap:10px;background:rgba(200,0,0,.85);color:#fff;padding:0 10px}
.ytp-chrome-bottom button{font:inherit;color:#fff;background:#600;border:0;padding:4px 8px}
.ytp-chrome-top{position:absolute;left:0;right:0;top:0;height:40px;background:rgba(200,0,0,.6)}
.video-ads{position:absolute;inset:0;pointer-events:none;display:none}
#movie_player.ad-showing .video-ads{display:block}
.ytp-ad-text{position:absolute;left:16px;top:16px;background:rgba(0,0,0,.6);padding:4px 8px;pointer-events:auto}
.ytp-ad-skip-button-container{position:absolute;right:0;bottom:84px;pointer-events:auto}
.ytp-skip-ad-button{font:600 15px "Segoe UI",sans-serif;color:#fff;background:rgba(0,0,0,.75);border:1px solid #aaa;padding:10px 18px;cursor:pointer}
.ytp-ad-button{display:none}
#movie_player.ad-showing .ytp-ad-button{display:inline-block}
/* Today's ad overlay (read 10-18 from a real pre-roll): one layer over the whole player, its pieces anchored to ITS
   bottom: "Sponsored" and the advertiser's link 15px up, the advertiser's card 45px up. */
.ytp-ad-player-overlay-layout{position:absolute;left:0;right:0;top:0;bottom:0;height:100%;pointer-events:none}
.ytp-ad-player-overlay-layout__ad-info-container{position:absolute;left:22px;bottom:15px;display:flex;gap:8px;align-items:center;pointer-events:auto}
.ytp-ad-badge--clean-player{font-weight:700;background:rgba(0,0,0,.5);padding:4px 6px}
.ytp-visit-advertiser-link{color:#fff;background:rgba(0,0,0,.5);padding:4px 6px;cursor:pointer}
.ytp-ad-player-overlay-layout__player-card-container{position:absolute;left:22px;bottom:45px;pointer-events:auto}
.ytp-ad-player-card{display:flex;gap:10px;align-items:center;background:rgba(20,20,20,.85);padding:8px 10px;border-radius:8px}
.ytp-ad-player-card button{font:600 13px "Segoe UI",sans-serif;background:#3ea6ff;color:#000;border:0;border-radius:14px;padding:6px 12px}
</style></head><body>
<div id="movie_player" class="html5-video-player">
  <video class="html5-main-video" id="v" src="/__media/clip.mp4" autoplay muted loop playsinline></video>
  <div class="ytp-chrome-top" id="yttop"></div>
  <div class="ytp-chrome-bottom" id="ytbar">
    <button class="ytp-play-button" id="ytplay">Play</button><span>YouTube's own bar</span>
    <button class="ytp-ad-button" id="whyad">Why this ad</button>
    <button class="ytp-subtitles-button" aria-pressed="false">CC</button><button class="ytp-settings-button">Settings</button><button class="ytp-fullscreen-button" id="ytfs">Full screen</button>
  </div>
  <div class="video-ads ytp-ad-module">
    <div class="ytp-ad-text" id="adtext">Ad 1 of 1 <span class="ytp-ad-duration-remaining">0:12</span></div>
    <div class="ytp-ad-skip-button-container"><button class="ytp-skip-ad-button" id="skip">Skip</button></div>
    <div class="ytp-ad-player-overlay-layout" id="adlayer">
      <div class="ytp-ad-player-overlay-layout__player-card-container"><div class="ytp-ad-player-card" id="adcard"><span>Advertiser one</span><span>advertiser.example</span><button id="adplay" onclick="window.__adClicks=(window.__adClicks||0)+1">Play now</button></div></div>
      <div class="ytp-ad-player-overlay-layout__ad-info-container" id="adinfo"><span class="ytp-ad-badge--clean-player" id="adsponsored">Sponsored</span><div class="ytp-visit-advertiser-link ytp-ad-component--clickable" id="adlink" onclick="window.__adLinks=(window.__adLinks||0)+1">advertiser.example</div></div>
    </div>
  </div>
</div>
<script>
(function () {
  var p = document.getElementById('movie_player'), v = document.getElementById('v');
  window.__pageKeys = []; window.__q = 'hd720'; window.__range = null; window.__cc = {}; window.__mods = []; window.__at = { id: 'en.4', displayName: 'English (original)' };
  var AT = [window.__at, { id: 'es.3', displayName: 'Español (dubbed)' }];
  p.getAvailableQualityLevels = function () { return ['hd1080', 'hd720', 'large', 'medium', 'auto']; };
  p.getPlaybackQuality = function () { return window.__q; };
  p.setPlaybackQualityRange = function (a, b) { window.__range = [a, b]; if (a !== 'auto') window.__q = a; };
  p.getOption = function (m, k) { if (m !== 'captions') return null; return k === 'tracklist' ? [{ languageCode: 'en', displayName: 'English' }, { languageCode: 'es', displayName: 'Español' }] : window.__cc; };
  p.setOption = function (m, k, t) { if (m === 'captions' && k === 'track') window.__cc = t || {}; };
  p.loadModule = function (m) { window.__mods.push('+' + m); };
  p.unloadModule = function (m) { window.__mods.push('-' + m); window.__cc = {}; };
  p.getAvailableAudioTracks = function () { return AT; };
  p.getAudioTrack = function () { return window.__at; };
  p.setAudioTrack = function (t) { window.__at = t; };
  // YouTube's own keys and double-click (what Lumen's bar must take over while it is on).
  document.addEventListener('keydown', function (e) {
    window.__pageKeys.push(e.key);
    if (e.key === 'k') { if (v.paused) v.play(); else v.pause(); }
    if (e.key === 'f') p.requestFullscreen();
  });
  p.addEventListener('dblclick', function () { p.requestFullscreen(); });
  document.getElementById('ytfs').onclick = function () { p.requestFullscreen(); };
  document.getElementById('ytplay').onclick = function () { window.__ownPlay = (window.__ownPlay || 0) + 1; };
  // The ad: the same <video> plays it (as on YouTube), 30 s from its end; Skip ends it.
  var saved = 0;
  window.__startAd = function () { saved = v.currentTime; p.classList.add('ad-showing'); v.currentTime = Math.max(0, v.duration - 30); window.__skipped = false; return v.currentTime; };
  window.__endAd = function () { p.classList.remove('ad-showing'); v.currentTime = saved; };
  document.getElementById('skip').onclick = function () { window.__skipped = true; window.__endAd(); };
  document.getElementById('whyad').onclick = function () { window.__why = true; };
})();
</script></body></html>
