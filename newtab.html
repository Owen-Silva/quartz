<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<!-- Sets data-theme on <html> and paints ?hue= over the --ion* tokens.
     Must stay the first script, and must stay above the stylesheet, or a
     light window flashes dark (and a custom accent flashes cyan) on load. -->
<script src="newtab-theme.js"></script>
<link rel="stylesheet" href="newtab.css">
</head>
<body>

<!-- Coloured light behind the glass. Fixed, inert, always the bottom layer. -->
<div class="backdrop" aria-hidden="true">
  <div class="aurora-base"></div>
  <div class="aurora-band"></div>
  <div class="aurora-pool"></div>
  <div class="aurora-rim"></div>
</div>

<!-- The user's own picture, for newtabBackground.kind === 'image'. Both layers
     stay display:none until <html data-bg="image">, and the picture itself is
     only ever set by window.__applyBackground() as an inline background-image
     (a data: URL the chrome read out of IndexedDB). -->
<div id="bg-image" aria-hidden="true"></div>
<div id="bg-dim" aria-hidden="true"></div>

<!-- The board: a circuit around the column, drawn in JS. Inert, above the aurora.
     Hidden by CSS for data-bg="aurora", and for data-bg="image" unless the
     picture asked for it back (data-bg-board="over"). -->
<canvas id="board" aria-hidden="true"></canvas>

<!-- The two live modules, seated on the board where its biggest chips used
     to sit. newtab-bg.js owns nothing but their left/top: it measures the
     socket, keeps each tile clear of it, marks the cells underneath so no
     trace runs below one, and routes traces onto the pads around it. The
     CSS default (the window's top corners) is what they wear until it has
     measured, so a board that never starts still leaves them somewhere
     sensible. Content is newtab.js's: the clock ticks on a minute-aligned
     timeout, and the readout stays [hidden] until __applyReadout. -->
<section id="mod-clock" class="module module-clock" aria-label="Clock">
  <p class="mod-time">
    <span id="clock-time" class="mod-time-value">--:--</span>
    <span id="clock-period" class="mod-time-period"></span>
  </p>
  <p id="clock-date" class="mod-date"></p>
</section>

<section id="mod-session" class="module module-session" aria-label="Session" hidden>
  <p class="mod-row">
    <span id="read-tabs" class="mod-value">--</span>
    <span id="read-tabs-label" class="mod-label">tabs open</span>
  </p>
  <p class="mod-row">
    <span id="read-claude" class="mod-value">--</span>
    <span id="read-claude-label" class="mod-label">Claude sessions</span>
  </p>
  <p class="mod-row">
    <span id="read-autopause" class="mod-value">--</span>
    <span class="mod-label">Spotify auto-pause</span>
  </p>
</section>

<main class="stage">
  <div class="column">
    <!-- The instrument strip, where the search field used to be: five
         readouts the chrome pushes in every 2 s with __applyStats().
         There is no search box here on purpose — the address bar above
         is where this window searches.

         Every box below is sized by CSS and not by its content, so the
         strip wears its final height from the first paint: the dashes
         it shows before the first sample occupy exactly the room the
         numbers will, and nothing jumps when they land. newtab-bg.js
         measures this column for its socket, so that matters twice. -->
    <section id="stats" class="stats" aria-label="System">
      <div class="stat">
        <p class="stat-value"><span id="st-cpu">&#8212;</span></p>
        <p class="stat-label">CPU</p>
        <canvas id="sg-cpu" class="stat-graph" width="120" height="28" aria-hidden="true"></canvas>
      </div>

      <div class="stat">
        <p class="stat-value stat-value-sm"><span id="st-mem">&#8212;</span></p>
        <p class="stat-label">Memory</p>
        <canvas id="sg-mem" class="stat-graph" width="120" height="28" aria-hidden="true"></canvas>
      </div>

      <div class="stat">
        <p class="stat-value"><span id="st-disk">&#8212;</span></p>
        <p class="stat-label">Disk</p>
        <canvas id="sg-disk" class="stat-graph" width="120" height="28" aria-hidden="true"></canvas>
      </div>

      <div class="stat">
        <p class="stat-value stat-value-pair">
          <span id="st-net-down" class="stat-line">&#8212;</span>
          <span id="st-net-up" class="stat-line">&#8212;</span>
        </p>
        <p class="stat-label">Network (bits/s)</p>
        <canvas id="sg-net" class="stat-graph" width="120" height="28" aria-hidden="true"></canvas>
      </div>

      <div class="stat">
        <p class="stat-value"><span id="st-gpu">&#8212;</span></p>
        <p class="stat-label">GPU</p>
        <canvas id="sg-gpu" class="stat-graph" width="120" height="28" aria-hidden="true"></canvas>
      </div>
    </section>

    <nav id="links" class="links" aria-label="Shortcuts"></nav>

    <!-- Recent sites pushed in with window.__applyRecent(); stays hidden
         until there is something left after the shortcut hosts are removed. -->
    <nav id="recent" class="recent" aria-label="Recent sites" hidden></nav>
  </div>
</main>

<script src="newtab-bg.js"></script>
<script src="newtab.js"></script>
</body>
</html>
