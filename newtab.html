<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<!-- Sets data-theme on <html> and paints ?hue= over the --ion* tokens.
     Must stay the first script, and must stay above the stylesheet, or a
     light window flashes dark (and a custom accent flashes cyan) on load. -->
<script src="newtab-theme.js"></script>
<link rel="stylesheet" href="newtab.css">
</head>
<body>

<!-- Coloured light behind the glass. Fixed, inert, always the bottom layer. -->
<div class="backdrop" aria-hidden="true">
  <div class="aurora-base"></div>
  <div class="aurora-band"></div>
  <div class="aurora-pool"></div>
  <div class="aurora-rim"></div>
</div>

<!-- The user's own picture, for newtabBackground.kind === 'image'. Both layers
     stay display:none until <html data-bg="image">, and the picture itself is
     only ever set by window.__applyBackground() as an inline background-image
     (a data: URL the chrome read out of IndexedDB). -->
<div id="bg-image" aria-hidden="true"></div>

<!-- The moving picture, for newtabBackground.kind === 'video'. The chrome
     copies the chosen clip into its own folder and pushes the file:// URL
     through the same __applyBackground() call; this page never knows the
     path until then, so both layers start empty and display:none.

     Two layers because two kinds of file: a real clip (mp4/webm/mov/m4v)
     plays in the <video>, and a GIF — which animates itself and cannot be
     decoded by a media element — lands in the <img>. Exactly one of them
     is ever .on. Muted and playsinline so it may autoplay at all, loop so
     it never ends, and no picture-in-picture button on a background. -->
<video id="bg-video" aria-hidden="true" muted loop autoplay playsinline
       preload="auto" disablepictureinpicture tabindex="-1"></video>
<img id="bg-video-img" aria-hidden="true" alt="">

<div id="bg-dim" aria-hidden="true"></div>

<!-- The board: a circuit around the column, drawn in JS. Inert, above the aurora.
     Hidden by CSS for data-bg="aurora", and for data-bg="image" unless the
     picture asked for it back (data-bg-board="over"). -->
<canvas id="board" aria-hidden="true"></canvas>

<!-- The live modules, seated on the board where its biggest chips used
     to sit. newtab-bg.js owns nothing but their left/top: it measures the
     socket, keeps each tile clear of it, marks the cells underneath so no
     trace runs below one, and routes traces onto the pads around it. The
     CSS default (the window's top corners) is what they wear until it has
     measured, so a board that never starts still leaves them somewhere
     sensible. Content is newtab.js's: the clock ticks on a minute-aligned
     timeout, and the readout stays [hidden] until __applyReadout. -->
<section id="mod-clock" class="module module-clock" aria-label="Clock">
  <p class="mod-time">
    <span id="clock-time" class="mod-time-value">--:--</span>
    <span id="clock-period" class="mod-time-period"></span>
  </p>
  <p id="clock-date" class="mod-date"></p>
</section>

<section id="mod-session" class="module module-session" aria-label="Session" hidden>
  <!-- The three counts stay hidden until __applyReadout, the same way the
       tile itself used to: an idle-music push can now be the thing that
       reveals the tile, and three dashes are still worse than no readout. -->
  <div id="session-rows" hidden>
    <p class="mod-row">
      <span id="read-tabs" class="mod-value">--</span>
      <span id="read-tabs-label" class="mod-label">tabs open</span>
    </p>
    <p class="mod-row">
      <span id="read-claude" class="mod-value">--</span>
      <span id="read-claude-label" class="mod-label">Claude sessions</span>
    </p>
    <p class="mod-row">
      <span id="read-autopause" class="mod-value">--</span>
      <span class="mod-label">Spotify auto-pause</span>
    </p>
  </div>

  <!-- Idle music. The player itself lives in the chrome so it survives tab
       switches; this is only its face and its two controls. Every state
       ("Off", "Paused", a mood name, a file name) is one fixed-height line
       and both controls are a fixed box, so the tile the board measured
       does not change size when the music starts, stops or changes track.
       Content is newtab.js's: __applyMusic() in, `newtab:music` out. -->
  <div id="mod-music" class="mod-music" data-music="off">
    <p class="mod-music-head">
      <span class="mod-music-caption">Idle music</span>
    </p>
    <p class="mod-music-row">
      <span id="music-state" class="mod-music-state">Off</span>
      <span class="mod-music-ctls">
        <button id="music-next" type="button" class="mod-music-btn mod-music-next"
                disabled aria-hidden="true">Next</button>
        <button id="music-toggle" type="button" class="mod-music-btn">Turn on</button>
      </span>
    </p>
    <p class="mod-music-hint">Plays while nothing else is playing</p>
  </div>
</section>

<!-- What is playing on the MACHINE, with its transport. A readout and three
     controls, never a player: nothing plays in this page (no Widevine in a
     tab). The chrome polls the user's Spotify auto-pause bridge, which already
     holds a Windows media session, and pushes the state in.

     Every box here has a fixed height and the two controls a fixed box, for
     the reason the tile itself gives: the board draws a seat around the box
     it measured, so "Nothing playing" becoming a track with art — or a long
     title, or Next going away for a station — must not move a pixel of it.
     Content is newtab.js's: __applyMedia() in, `newtab:media` out. -->
<section id="mod-media" class="module module-media" aria-label="Now playing"
         data-media="none" hidden>
  <div class="mod-media-body">
    <span class="mod-media-art">
      <!-- The art arrives as base64 JPEG on the push; src is set once per
           distinct string, so a poll that changes nothing costs no decode. -->
      <img id="media-art" class="mod-media-art-img" alt="" hidden>
      <svg class="mod-media-note" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M10 6.4 18.8 3.8v3.1L10 9.5z"/>
        <circle cx="7.6" cy="16.4" r="2.7"/>
        <path d="M9.3 5.6h1.4v10.8H9.3z"/>
        <circle cx="16.4" cy="14.4" r="2.7"/>
        <path d="M18.1 3.6h1.4v10.8h-1.4z"/>
      </svg>
    </span>
    <span class="mod-media-meta">
      <span id="media-title" class="mod-media-title">Nothing playing</span>
      <span id="media-artist" class="mod-media-artist"></span>
    </span>
  </div>

  <!-- The position, interpolated in the page between pushes and frozen the
       moment it is paused. aria-hidden because no time is stated in words:
       there is nothing here for a screen reader that the title has not
       already said. -->
  <div class="mod-media-bar" aria-hidden="true">
    <span id="media-fill" class="mod-media-fill"></span>
  </div>

  <p class="mod-media-ctls">
    <button id="media-prev" type="button" class="mod-media-btn"
            aria-label="Previous track" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M4 3.2h1.6v9.6H4z"/>
        <path d="M13 3.4v9.2L6.4 8z"/>
      </svg>
    </button>
    <button id="media-toggle" type="button" class="mod-media-btn mod-media-play"
            aria-label="Play" disabled>
      <svg class="mod-media-glyph-play" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M4.8 3.2v9.6L13 8z"/>
      </svg>
      <svg class="mod-media-glyph-pause" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M4.7 3.2h2.2v9.6H4.7zM9.1 3.2h2.2v9.6H9.1z"/>
      </svg>
    </button>
    <button id="media-next" type="button" class="mod-media-btn"
            aria-label="Next track" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M10.4 3.2H12v9.6h-1.6z"/>
        <path d="M3 3.4v9.2L9.6 8z"/>
      </svg>
    </button>
  </p>
</section>

<main class="stage">
  <div class="column">
    <!-- The instrument strip, where the search field used to be: five
         readouts the chrome pushes in every second with __applyStats().
         There is no search box here on purpose — the address bar above
         is where this window searches.

         Every box below is sized by CSS and not by its content, so the
         strip wears its final height from the first paint: the dashes
         it shows before the first sample occupy exactly the room the
         numbers will, and nothing jumps when they land. newtab-bg.js
         measures this column for its socket, so that matters twice. -->
    <section id="stats" class="stats" aria-label="System">
     <div class="stats-strip">
      <div class="stat">
        <p class="stat-value"><span id="st-cpu">&#8212;</span></p>
        <p class="stat-label">CPU</p>
        <canvas id="sg-cpu" class="stat-graph" width="120" height="28" aria-hidden="true"></canvas>
      </div>

      <div class="stat">
        <p class="stat-value stat-value-sm"><span id="st-mem">&#8212;</span></p>
        <p class="stat-label">Memory</p>
        <canvas id="sg-mem" class="stat-graph" width="120" height="28" aria-hidden="true"></canvas>
      </div>

      <div class="stat">
        <p class="stat-value"><span id="st-disk">&#8212;</span></p>
        <p class="stat-label">Disk</p>
        <canvas id="sg-disk" class="stat-graph" width="120" height="28" aria-hidden="true"></canvas>
      </div>

      <div class="stat">
        <p class="stat-value stat-value-pair">
          <span id="st-net-down" class="stat-line">&#8212;</span>
          <span id="st-net-up" class="stat-line">&#8212;</span>
        </p>
        <p class="stat-label">Network (bits/s)</p>
        <canvas id="sg-net" class="stat-graph" width="120" height="28" aria-hidden="true"></canvas>
      </div>

      <div class="stat">
        <p class="stat-value"><span id="st-gpu">&#8212;</span></p>
        <p class="stat-label">GPU</p>
        <canvas id="sg-gpu" class="stat-graph" width="120" height="28" aria-hidden="true"></canvas>
      </div>

      <!-- The one thing in the strip you can press: it unfolds the process
           list underneath. Out of flow at full width (the strip's five
           columns are full), and a grid cell of its own once the strip
           folds and the last cell is empty — either way the closed capsule
           is exactly as tall as it was before it existed, which is what
           the board measured. -->
      <button id="procs-open" class="stats-open" type="button"
              aria-expanded="false" aria-controls="procs">
        <span>Processes</span>
        <span class="stats-open-chevron" aria-hidden="true"></span>
      </button>
     </div>

      <!-- The process list: what Task Manager's Processes tab shows,
           grouped by program, folded into the capsule under the strip.
           Closed on a first run; after that it wears whatever the last
           tab left in localStorage, restored before the first paint so
           nothing unfolds in front of you.

           The wrapper is a one-row grid: 0fr closed, 1fr open, stepped
           over 160ms. That animates the ROW, so the chips and the recents
           below are pushed down by the section's real height and nothing
           needs to know what that height is.

           Its interior is the only near-opaque surface on the page: rows
           of numbers have to be read over whatever the user chose as a
           background, so it takes --panel-bg and a hairline instead of
           glass. Nothing in it is ever rebuilt: a sample writes into text
           nodes of rows that already exist and moves the nodes when the
           order changes. While it is closed, samples are kept and not
           drawn.

           Every row wears a 16px icon slot left of its name, filled by
           window.__applyProcIcons() with the real executable's icon when
           the main process has resolved one and by a neutral window
           outline until then. The slot is the same width empty, so the
           dashed rows below line up with the real ones. -->
      <div id="procs-wrap" class="procs-wrap">
        <section id="procs" class="procs" aria-label="Processes">
          <div class="procs-inner">
            <div class="procs-table" role="table" aria-label="Processes">
              <div class="procs-head" role="row">
                <span class="proc-col proc-name" role="columnheader">Name</span>
                <button id="proc-sort-cpu" class="proc-col proc-cpu proc-sort" type="button"
                        role="columnheader" aria-sort="descending">CPU</button>
                <button id="proc-sort-mem" class="proc-col proc-mem proc-sort" type="button"
                        role="columnheader" aria-sort="none">Memory</button>
                <span class="proc-col proc-io" role="columnheader">Disk and network</span>
                <span class="proc-col proc-act" role="columnheader">
                  <span class="proc-sr">End task</span>
                </span>
              </div>

              <div id="procs-body" class="procs-body" role="rowgroup"></div>
            </div>

            <button id="procs-more" class="procs-more" type="button" aria-expanded="false">Show more</button>
          </div>
        </section>
      </div>

      <!-- The app dock: what this machine opens — installed programs, web
           apps ('web:' pins, drawn with the site's favicon) and terminal
           programs ('term:' pins, a monospace >_ plate) — pinned into the
           capsule above the web chips. The chrome pushes them in with
           window.__applyApps({ pins, installed, webapps, programs }) and
           keeps the running lights current with
           window.__applyAppsRunning(map) — dots only, never a rebuild,
           because that arrives once a second.

           A press is a console line (`newtab:app {json}`) exactly like the
           process list's End task: there is no preload on this page, so a
           logged line is the whole channel. The chrome answers failures
           with window.__applyAppResult().

           The row keeps one tile-row of height whether it holds nothing or
           nine, so the capsule the board measured does not move when the
           first pin lands; more than one row grows it, and newtab.js
           re-seats the board when it does. -->
      <section id="dock" class="dock" aria-label="Apps">
        <div class="dock-head">
          <p class="dock-caption">Apps</p>
          <button id="dock-edit" class="dock-edit" type="button" aria-pressed="false">Edit</button>
        </div>

        <div id="dock-row" class="dock-row"></div>

        <!-- The picker: one field over three groups — the installed index,
             the web apps, and the terminal programs this machine has — and
             the eight best names in each for what is typed. Near-opaque
             like the process list, for the same reason: a list of names has
             to read over whatever the user chose as a background. -->
        <div id="dock-picker" class="dock-picker" hidden>
          <input id="dock-search" class="dock-search" type="text"
                 placeholder="Search apps, sites and shells" autocomplete="off"
                 spellcheck="false" aria-label="Search apps, sites and shells"
                 aria-controls="dock-results" aria-expanded="true"
                 role="combobox" aria-autocomplete="list">
          <ul id="dock-results" class="dock-results" role="listbox" aria-label="Apps to pin"></ul>
        </div>
      </section>
    </section>

    <nav id="links" class="links" aria-label="Shortcuts"></nav>

    <!-- Recent sites pushed in with window.__applyRecent(); stays hidden
         until there is something left after the shortcut hosts are removed. -->
    <nav id="recent" class="recent" aria-label="Recent sites" hidden></nav>
  </div>
</main>

<!-- Live prices, bottom right. The only tile on this page the board does not
     seat: newtab-bg.js's MODULE_SPEC names three ids and this is not one of
     them, so it keeps the corner CSS gives it and the traces simply run
     under it (the glass is opaque enough that they do not read through).

     Its data is main's, not the chrome's: stocks.js puts a listener on this
     guest and answers `newtab:stocks {json}` lines — subscribe, unsubscribe,
     select, add, remove — with window.__applyStocks(). The Finnhub key is
     never part of that, in either direction; the page is only ever told
     whether one is set.

     Both canvases are drawn by newtab.js at most twice a second and only
     when a number actually moved. Nothing here animates. -->
<section id="mod-stocks" class="module module-stocks" aria-label="Markets"
         data-state="loading" hidden>
  <div class="stk-head">
    <p class="stk-caption">Markets</p>
    <span id="stk-market" class="stk-market" data-market="closed">Closed</span>
  </div>

  <!-- The one-line states: no key, a refused key, nothing to draw. -->
  <p id="stk-note" class="stk-note" hidden></p>

  <!-- The selected symbol's day. The dashed line is the previous close, the
       tint under the line is the day's sign, and the whole thing is one
       canvas sized in CSS pixels times devicePixelRatio. -->
  <div class="stk-chart">
    <canvas id="stk-canvas" class="stk-canvas" width="352" height="132"
            role="img" aria-label="Intraday chart"></canvas>
    <p id="stk-chart-empty" class="stk-chart-empty" hidden>No history yet</p>
  </div>

  <!-- One row per symbol: name, last, day change, sparkline, and an x that
       only appears on hover or focus. Rows are <button>s so the keyboard can
       reach the selection at all. -->
  <ul id="stk-rows" class="stk-rows"></ul>

  <div class="stk-foot">
    <button id="stk-add" class="stk-add" type="button" aria-label="Add a symbol">+</button>
    <!-- Shown in place of the button while a ticker is being typed. -->
    <input id="stk-add-field" class="stk-add-field" type="text" hidden
           maxlength="12" autocomplete="off" spellcheck="false"
           placeholder="Ticker" aria-label="Add a symbol">
    <span id="stk-as-of" class="stk-as-of"></span>
  </div>
</section>

<script src="newtab-bg.js"></script>
<!-- The web-app catalogue, so a 'web:' pin has a name and a host to draw
     from the first paint. The chrome's push is still the authority — it is
     the only side that knows which of these apps is also installed. -->
<script src="webapps.js"></script>
<script src="newtab.js"></script>
</body>
</html>
