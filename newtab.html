<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<!-- Sets data-theme on <html> and paints ?hue= over the --ion* tokens.
     Must stay the first script, and must stay above the stylesheet, or a
     light window flashes dark (and a custom accent flashes cyan) on load. -->
<script src="newtab-theme.js"></script>
<link rel="stylesheet" href="newtab.css">
</head>
<body>

<!-- Coloured light behind the glass. Fixed, inert, always the bottom layer. -->
<div class="backdrop" aria-hidden="true">
  <div class="aurora-base"></div>
  <div class="aurora-band"></div>
  <div class="aurora-pool"></div>
  <div class="aurora-rim"></div>
</div>

<!-- The board: a circuit around the field, drawn in JS. Inert, above the aurora. -->
<canvas id="board" aria-hidden="true"></canvas>

<main class="stage">
  <div class="column">
    <p class="wordmark">Search</p>

    <!-- The placeholder below is the pre-script default; newtab.js rewrites
         it for the chosen engine ("Search DuckDuckGo or type a URL"). -->
    <form id="search" class="searchform" autocomplete="off" novalidate>
      <input id="q"
             class="field"
             type="text"
             name="q"
             placeholder="Search Google or type a URL"
             aria-label="Search Google or type a URL"
             autofocus
             spellcheck="false"
             autocapitalize="off"
             autocorrect="off"
             role="combobox"
             aria-autocomplete="list"
             aria-controls="q-suggest"
             aria-expanded="false">

      <!-- Typed-match dropdown, built by newtab.js out of the recent list.
           Absolutely positioned over the page, so it never changes the
           column's box (the circuit socket is measured from that box). -->
      <div id="q-suggest" class="suggest" role="listbox" aria-label="Recent matches" hidden></div>
    </form>

    <nav id="links" class="links" aria-label="Shortcuts"></nav>

    <!-- Recent sites pushed in with window.__applyRecent(); stays hidden
         until there is something left after the shortcut hosts are removed. -->
    <nav id="recent" class="recent" aria-label="Recent sites" hidden></nav>
  </div>
</main>

<script src="newtab-bg.js"></script>
<script src="newtab.js"></script>
</body>
</html>
