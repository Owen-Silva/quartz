# The test suite on GitHub's runners (tools/run-suite.js; one "quartz-suite: N files: ..." verdict line).
#
#   unit  every push and pull request: the pure-node harnesses (`run-suite.js --unit`), no Electron.
#   full  nightly and on demand (Actions > ci > Run workflow): every harness, then every Electron e2e in
#         a real off-screen --test-profile instance, one at a time, on the castlabs build.
#   audit every push, pull request, night and manual run: `npm audit --omit=dev` over the runtime
#         dependencies in package-lock.json; fails on any high or critical advisory (see the job for
#         the castlabs build).
#
# Both run on windows-latest. Quartz is a Windows app and several unit harnesses exercise Windows itself
# (they spawn powershell.exe, make real junctions and file locks, and expect case-insensitive paths), so
# an Ubuntu job would test a platform Quartz does not run on.
#
# A run is judged by the verdict line, never by the exit code alone: no verdict line, or any FAIL in it,
# fails the job. The verdict and every FAIL / SKIP line (each with its reason) go to the run's summary page.
#
# Every action is pinned to a full commit SHA; the comment names the release it was taken from.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 7 * * *' # nightly, 07:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes. The event is part of the key so a
# push never cancels the nightly full run, nor the other way round.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # Like oss-guard: Actions minutes are free only while the repository is public.
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: no castlabs Electron download (electron/install.js) and no Quartz.exe stamping
      # (postinstall: tools/make-quartz-exe.js). No unit harness needs either; node-pty's native build is
      # not needed either (the one test that opens a terminal is an e2e and skips itself without it).
      - name: Install (no install scripts)
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Unit suite
        run: |
          set +e
          node tools/run-suite.js --unit --out=suite-out 2>&1 | tee suite-log.txt
          echo "run-suite exit code: ${PIPESTATUS[0]}"
          exit 0

      - name: Verdict
        run: |
          verdict=$(grep '^quartz-suite: ' suite-log.txt | tail -n 1)
          {
            echo '### Unit suite'
            echo
            echo '```'
            echo "${verdict:-quartz-suite: NO VERDICT LINE (the runner crashed or was killed; see the log)}"
            grep -E '^(FAIL|SKIP) |^       ' suite-log.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$verdict" ]; then echo "::error::no quartz-suite verdict line"; exit 1; fi
          if ! echo "$verdict" | grep -q ' 0 FAIL,'; then echo "::error::$verdict"; exit 1; fi
          echo "$verdict"

      - name: Upload logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-suite-out
          path: |
            suite-log.txt
            suite-out/
          retention-days: 14
          if-no-files-found: ignore

  # Known advisories in the runtime dependencies (what ships and runs with the browser; devDependencies
  # are left out). It runs on pushes and PRs (a new or bumped dependency), on the nightly schedule (a new
  # advisory against dependencies that did not change) and on demand. npm audit reads only
  # package-lock.json, so there is no install step.
  #
  # Electron is a git dependency (github:castlabs/electron-releases#vX.Y.Z+wvcus), not a registry package.
  # npm audit still checks it: it matches by the lockfile's name and version, `electron` + `X.Y.Z+wvcus`,
  # and semver ignores the `+wvcus` build tag, so the castlabs build is audited as upstream electron@X.Y.Z.
  # That is the true verdict: a castlabs release is upstream Electron at that version plus Widevine, so
  # upstream's advisories apply to it. Two things are handled by hand so the verdict stays true:
  #   - npm reports such an advisory as "No fix available" because it cannot move a git dependency. The fix
  #     is a newer castlabs tag at or above the advisory's patched version (tools/check-electron.js lists
  #     them); the verdict line says so.
  # Both are in tools/audit-verdict.js (tested by tests/audit-verdict-test.js), not inline here.
  #   - If the lockfile ever lost electron's version (an unversioned git entry), audit would skip electron
  #     without a word and pass. The first step fails the job in that case instead of passing it.
  audit:
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Electron is visible to the audit
        run: node tools/audit-verdict.js --check-lock package-lock.json

      # The table is printed in full (every severity); the verdict counts only high and critical.
      - name: npm audit (runtime dependencies)
        run: |
          set +e
          npm audit --omit=dev
          npm audit --omit=dev --json > audit.json
          exit 0

      - name: Verdict
        run: |
          verdict=$(node tools/audit-verdict.js audit.json)
          { echo '### npm audit (runtime dependencies)'; echo; echo '```'; echo "$verdict"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$verdict"
          case "$verdict" in
            'npm-audit: runtime deps: 0 critical, 0 high,'*) exit 0 ;;
            *) echo "::error::$verdict"; exit 1 ;;
          esac

  full:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # npm blocks Electron's own install script on the runner, so install with --ignore-scripts and run
      # the castlabs ECS download by hand. Quartz.exe is not needed: the e2e tests launch electron.exe.
      - name: Install, then the castlabs Electron build
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          node node_modules/electron/install.js
          ls -l node_modules/electron/dist/electron.exe
          node -p "'electron ' + require('./node_modules/electron/package.json').version"

      # Each e2e launches its own off-screen instance (--test-profile --profile-name=<its own> --offscreen,
      # its own debugging port) and deletes that throwaway profile afterwards; run-suite runs them one at a time.
      - name: Full suite
        run: |
          set +e
          node tools/run-suite.js --out=suite-out 2>&1 | tee suite-log.txt
          echo "run-suite exit code: ${PIPESTATUS[0]}"
          exit 0

      - name: Verdict
        run: |
          verdict=$(grep '^quartz-suite: ' suite-log.txt | tail -n 1)
          {
            echo '### Full suite (unit + Electron e2e)'
            echo
            echo '```'
            echo "${verdict:-quartz-suite: NO VERDICT LINE (the runner crashed or was killed; see the log)}"
            grep -E '^(FAIL|SKIP) |^       ' suite-log.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$verdict" ]; then echo "::error::no quartz-suite verdict line"; exit 1; fi
          if ! echo "$verdict" | grep -q ' 0 FAIL,'; then echo "::error::$verdict"; exit 1; fi
          echo "$verdict"

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-suite-out
          path: |
            suite-log.txt
            suite-out/
          retention-days: 14
          if-no-files-found: ignore
