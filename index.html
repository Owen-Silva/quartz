<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Sets data-theme on <html> before the stylesheets apply, so light never flashes dark. -->
  <script src="theme-boot.js"></script>
  <title>Quartz</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="chrome.css">
  <link rel="stylesheet" href="backdrop.css">
  <link rel="stylesheet" href="find.css">
  <link rel="stylesheet" href="downloads.css">
  <link rel="stylesheet" href="shield.css">
  <link rel="stylesheet" href="siteinfo.css">
  <link rel="stylesheet" href="history.css">
  <link rel="stylesheet" href="reader.css">
  <link rel="stylesheet" href="pip.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="bookmarks.css">
  <link rel="stylesheet" href="favtile.css">
  <link rel="stylesheet" href="tabsearch.css">
  <link rel="stylesheet" href="workspaces.css">
  <link rel="stylesheet" href="school-pane.css">
  <link rel="stylesheet" href="drm.css">
  <link rel="stylesheet" href="watch-player.css">
</head>
<body>

  <!-- The one background layer: the neutral ground, the picture (blurred ONCE
       by backdrop.js into a small bitmap) and Helm's wash over it. The tab
       strip, toolbar and panes are translucent tints over this. -->
  <div class="backdrop" aria-hidden="true">
    <div class="bg-base"></div>
    <div class="bg-photo"></div>
    <!-- Helm's Home: the same picture UNBLURRED, shown only while a new tab
         is in front (dark), under the one wash. backdrop.js syncHome(). -->
    <div class="bg-clear"><div class="bg-clear-img"></div></div>
    <div class="bg-wash"></div>
  </div>

  <!-- Chrome layer: condenses in one frame after boot (body.booted). -->
  <div class="chrome-layer">

    <!-- Titlebar: tabs, new tab, window controls. This row drags the window. -->
    <div id="titlebar" class="glass">
      <div id="tabstrip"></div>
      <button id="newtab" type="button" title="New tab" aria-label="New tab">
        <span class="glyph">&#xE710;</span>
      </button>
      <div class="spacer"></div>
      <div class="wincontrols">
        <button id="win-min" type="button" title="Minimize" aria-label="Minimize">
          <span class="glyph">&#xE921;</span>
        </button>
        <!-- glyph swaps to &#xE923; (restore) when the window is maximized -->
        <button id="win-max" type="button" title="Maximize" aria-label="Maximize">
          <span class="glyph">&#xE922;</span>
        </button>
        <button id="win-close" type="button" title="Close" aria-label="Close">
          <span class="glyph">&#xE8BB;</span>
        </button>
      </div>
    </div>

    <!-- Nav row: instruments left, the omnibox lens centred. -->
    <div class="navrow glass">
      <button id="back" type="button" title="Back" aria-label="Back">
        <span class="glyph">&#xE76B;</span>
      </button>
      <button id="forward" type="button" title="Forward" aria-label="Forward">
        <span class="glyph">&#xE76C;</span>
      </button>
      <button id="reload" type="button" title="Reload" aria-label="Reload">
        <span class="glyph">&#xE72C;</span>
      </button>

      <!-- spellcheck stays off (no squiggles under addresses); data-autocorrect
           ="search" lets spell-preload.js fix finished SEARCH words only: it
           leaves the whole field alone when the first word looks like an
           address, path, email or command, and never fixes on Enter, so what
           the omnibox navigates to is never changed. -->
      <input id="omnibox" class="glass" type="text" spellcheck="false" autocomplete="off"
             autocapitalize="off" data-autocorrect="search"
             placeholder="Search or enter address" aria-label="Address bar">

      <!-- Zoom readout, at the omnibox's right edge. app.js writes the text and
           unhides it only while the page is off 100%, so the row does not move
           at the size everything is normally at. Click resets the zoom. -->
      <button id="zoom-badge" class="glass no-drag" type="button" hidden
              title="Reset zoom" aria-label="Reset zoom">100%</button>

      <!-- Save star: saves the page in front to the Saved list (the bookmarks
           list the new tab's Saved row shows), or forgets it. app.js shows it
           only on a real web page, swaps the glyph to &#xE735; (filled) and
           adds .saved while the page is saved, .failed for a moment when a
           save or removal was refused (the tooltip then says why). -->
      <button id="save-star" class="glass iconbtn no-drag" type="button" hidden
              title="Save page (Ctrl+D)" aria-label="Save page (Ctrl+D)" aria-pressed="false">
        <span class="glyph">&#xE734;</span>
      </button>

      <!-- glyph swaps to &#xE706; (sun) when the light theme is on -->
      <button id="theme" class="glass iconbtn no-drag" type="button" title="Switch theme" aria-label="Switch theme">
        <span class="glyph">&#xE708;</span>
      </button>
    </div>

  </div>

  <!-- The well row: the tab well and, beside it, the workspace's side pane.
       The row is what fills the window under the chrome; #views keeps every
       pixel of it while the pane is hidden, which is the whole layout this
       had before the pane existed. -->
  <div id="well">

    <!-- Tab well. Holds every tab body: <webview> pages and .claude-view
         chambers, created at runtime. Guest views do not clip, so nothing
         rounds or hides overflow here. -->
    <div id="views"></div>

    <!-- Side pane: a workspace-owned column BESIDE the tab well (never over it).
         app.js shows and sizes it for the current workspace's pane kind, sets
         data-kind, and puts its 6px drag handle in as the first child;
         school-pane.js fills #sidepane-body while the kind is 'school'.
         Hidden here, so it costs no layout until a workspace asks for it. -->
    <aside id="sidepane" hidden>
      <div id="sidepane-body"></div>
    </aside>

  </div>

  <!-- Tab context menu. Rows are written by app.js on right-click and cleared
       when it closes; position:fixed, so it also hangs over a guest page. -->
  <div id="tabmenu" role="menu" tabindex="-1" hidden></div>

  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <!-- Key bindings. Must stay above app.js, which reads window.Shortcuts. -->
  <script src="shortcuts.js"></script>
  <!-- The catalogue of sites the browser presents as apps. A lookup table only;
       app.js and tabsearch.js read window.WebApps. -->
  <script src="webapps.js"></script>
  <script src="drm-sites.js"></script>
  <script src="drm.js"></script>
  <!-- The Watch player layer: titles play inside Watch (watch-player-main.js is main's half). -->
  <script src="watch-player-hosts.js"></script>
  <script src="watch-player.js"></script>
  <!-- The new tab Home's layout rules (which pieces show, in which column).
       The page loads the same file, so both sides apply one set of rules;
       settings.js stores the layout through it and app.js answers the page's
       edits and gates each hidden piece's feed with it. Pure, no DOM. -->
  <script src="homelayout.js"></script>
  <!-- Idle music: the generative engine, then the player that decides when it
       may sound. Both cost nothing but their parse until the music is turned
       on — no AudioContext, no <audio> element, no timer — and app.js reads
       them lazily, so they only need to be here before the first decision. -->
  <script src="ambient.js"></script>
  <script src="music.js"></script>
  <script src="looksync/accent.browser.js"></script>
  <script src="tabicons.js"></script>
  <script src="app.js"></script>
  <script src="find.js"></script>
  <script src="downloads.js"></script>
  <script src="shield.js"></script>
  <script src="capture.js"></script>
  <script src="siteinfo.js"></script>
  <script src="tabsearch.js"></script>
  <script src="scorepins-chrome.js"></script>
  <script src="workspaces.js"></script>
  <!-- The School pane. It reads window.api only. -->
  <script src="school-pane.js"></script>
  <!-- node_modules/@mozilla/readability/Readability.js is deliberately NOT
       here: reader.js is the only thing that uses it and injects it itself the
       first time a reading page is opened, so boot does not pay for ~100KB
       most sessions never touch. -->
  <script src="reader.js"></script>
  <script src="pip.js"></script>
  <script src="history.js"></script>
  <script src="sitestyles.js"></script>
  <script src="looksync.js"></script>
  <script src="settings.js"></script>
  <!-- The first-run welcome (welcome.html): app.js calls FirstRun.boot() once the strip is up. -->
  <script src="firstrun.js"></script>
  <script src="keywords.js"></script>
  <script src="backdrop.js"></script>
  <!-- After backdrop.js: tells Mantle what the top pixel row looks like (top bar hints). -->
  <script src="toprow.js"></script>
  <script src="userstyle.js"></script>
  <script src="bookmarks.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
