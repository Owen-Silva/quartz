# Quartz-Setup.exe: electron-builder, NSIS, per user. Built on GitHub Actions only
# (.github/workflows/installer.yml); see tools/installer/README.md for what is inside and why.
#
#   npx electron-builder@26.18.0 --win nsis --x64 --config tools/installer/electron-builder.yml --publish never
#
# Run tools/installer/prepare.js first (CI checkouts only): electron-builder refuses an `electron`
# entry under "dependencies", where this repo keeps the castlabs build so `npm audit --omit=dev`
# audits it.
appId: com.owensilva.quartz          # = main.js APP_USER_MODEL_ID: the Start Menu shortcut carries it
productName: Quartz
copyright: Copyright the Quartz contributors. GPL-3.0-only.

directories:
  output: dist
  buildResources: tools/installer

# The castlabs Electron (Widevine) that `node node_modules/electron/install.js` downloaded, not a
# stock one from electron-builder's mirror. The workflow passes -c.electronVersion from its
# package.json (the castlabs version without the +wvcus build tag).
electronDist: node_modules/electron/dist

# No asar: Quartz starts PowerShell scripts, a C# helper and worker files from its own folder, and
# powershell.exe cannot read a file inside an asar archive.
asar: false

# node-pty (@homebridge/node-pty-prebuilt-multiarch) and koffi ship Node-API binaries, which load in
# any Electron: nothing to rebuild, and no compiler is needed.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

files:
  - "**/*"
  # Tests, test tools and the developer's own scripts stay in the repository.
  - "!**/*-e2e.js"
  - "!**/*-harness.js"
  - "!tests{,/**}"
  - "!tools{,/**}"
  - "!docs{,/**}"
  - "!.github{,/**}"
  - "!dist{,/**}"
  - "!smoketest.js"
  - "!cdp-eval.js"
  - "!cdp-profile.js"
  - "!toback.ps1"
  - "!memprobe.ps1"
  - "!relink-shortcut.ps1"
  - "!CLAUDE.md"
  # node-pty's Linux prebuilds are not used on Windows (it loads build/Release).
  - "!node_modules/@homebridge/node-pty-prebuilt-multiarch/prebuilds{,/**}"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/browser.ico
  # No code-signing certificate: unsigned. electron-builder still stamps the exe's icon and
  # version strings (rcedit), which is what Task Manager and the uninstall list show.
  signAndEditExecutable: true

nsis:
  oneClick: true
  perMachine: false                   # %LOCALAPPDATA%\Programs\Quartz, no admin prompt
  artifactName: Quartz-Setup.exe      # stable: pages link to releases/latest/download/Quartz-Setup.exe
  shortcutName: Quartz
  createStartMenuShortcut: true
  createDesktopShortcut: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false     # the profile (%APPDATA%\Quartz) stays: a clone may share it
  uninstallDisplayName: Quartz
  include: tools/installer/installer.nsh

publish: null
